<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoCiclo - Gestão de Reciclagem</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ========== TELA DE LOGIN ========== -->
    <section id="tela-login" class="login">
        <form id="form-login" class="login-card">
            <h1>♻ EcoCiclo</h1>
            <p class="sub">Sistema de Gestão de Reciclagem</p>
            <label>E-mail
                <input type="email" id="login-email" value="admin@ecociclo.com" required>
            </label>
            <label>Senha
                <input type="password" id="login-senha" required>
            </label>
            <button class="btn" type="submit">Entrar</button>
            <p id="login-erro" class="erro"></p>
        </form>
    </section>

    <!-- ========== APLICAÇÃO ========== -->
    <div id="tela-app" class="app oculto">
        <aside class="menu">
            <div class="logo">♻ EcoCiclo</div>
            <nav id="menu"></nav>
            <div class="usuario">
                <span id="usuario-nome"></span>
                <small id="usuario-perfil"></small>
                <button id="btn-sair" class="btn btn-sec">Sair</button>
            </div>
        </aside>
        <main>
            <h2 id="titulo-pagina"></h2>
            <div id="conteudo"></div>
        </main>
    </div>

    <!-- Janela (modal) usada nos formulários -->
    <div id="modal" class="modal oculto">
        <div class="modal-box">
            <h3 id="modal-titulo"></h3>
            <div id="modal-corpo"></div>
        </div>
    </div>

    <div id="toast" class="toast oculto"></div>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/paginas.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
